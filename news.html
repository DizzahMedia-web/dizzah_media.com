<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>News - Dizzah Media</title>

  <link rel="stylesheet" href="style.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    .news-container {
      width: 92%;
      max-width: 1100px;
      margin: 40px auto;
    }

    .news-title {
      text-align: center;
      margin-bottom: 30px;
    }

    .news-title h1 {
      margin-bottom: 10px;
    }

    .news-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 25px;
    }

    .news-card {
      background: #fff;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    .news-card img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      display: block;
    }

    .news-content {
      padding: 20px;
    }

    .news-category {
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    .news-content h2 {
      margin: 0 0 10px;
    }

    .news-content p {
      line-height: 1.6;
    }

    .news-date {
      font-size: 13px;
      margin-top: 15px;
      opacity: 0.7;
    }

    .loading {
      text-align: center;
      padding: 40px 10px;
    }

    .empty {
      text-align: center;
      padding: 40px 10px;
    }

    .error {
      text-align: center;
      padding: 30px;
    }
  </style>
</head>

<body>

  <header>
    <nav>
      <a href="index.html">DIZZAH MEDIA</a>
      <a href="index.html">Home</a>
      <a href="news.html">News</a>
      <a href="simulizi.html">Simulizi</a>
      <a href="movies.html">Movies</a>
      <a href="videos.html">Videos</a>
      <a href="gallery.html">Gallery</a>
      <a href="podcasts.html">Podcasts</a>
      <a href="motivation.html">Motivation</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <main class="news-container">

    <section class="news-title">
      <h1>Habari za Dizzah Media</h1>
      <p>Habari mpya kutoka Dizzah Media</p>
    </section>

    <section id="newsList" class="news-grid">
      <div class="loading">
        Inapakia habari...
      </div>
    </section>

  </main>

  <footer>
    <p>&copy; 2026 Dizzah Media. Haki zote zimehifadhiwa.</p>
  </footer>

  <script>
    const SUPABASE_URL =
      "https://otmejtcequreccarwvkt.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_9vUQ1lhAWELSbSGrk7Aw_Q_0h0-WvuX";

    const { createClient } = window.supabase;

    const supabaseClient = createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

    function escapeHTML(text) {
      if (text === null || text === undefined) return "";

      return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function formatDate(date) {
      if (!date) return "";

      return new Date(date).toLocaleDateString("sw-TZ", {
        year: "numeric",
        month: "long",
        day: "numeric"
      });
    }

    async function loadNews() {

      const newsList = document.getElementById("newsList");

      const { data, error } = await supabaseClient
        .from("posts")
        .select(
          "id,title,category,image_url,video_url,description,created_at"
        )
        .order("created_at", { ascending: false });

      if (error) {
        console.error(error);

        newsList.innerHTML = `
          <div class="error">
            <h2>Imeshindikana kupakia habari</h2>
            <p>Tafadhali jaribu tena baadaye.</p>
          </div>
        `;

        return;
      }

      if (!data || data.length === 0) {
        newsList.innerHTML = `
          <div class="empty">
            <h2>Hakuna habari bado</h2>
            <p>Habari mpya zitaonekana hapa.</p>
          </div>
        `;

        return;
      }

      newsList.innerHTML = data.map(post => {

        const image = post.image_url
          ? escapeHTML(post.image_url)
          : "https://via.placeholder.com/800x450?text=Dizzah+Media";

        return `
          <article class="news-card">

            <img
              src="${image}"
              alt="${escapeHTML(post.title)}"
              onerror="this.src='https://via.placeholder.com/800x450?text=Dizzah+Media'"
            >

            <div class="news-content">

              <div class="news-category">
                ${escapeHTML(post.category || "Habari")}
              </div>

              <h2>
                ${escapeHTML(post.title)}
              </h2>

              <p>
                ${escapeHTML(post.description || "")}
              </p>

              ${
                post.video_url
                  ? `
                    <p>
                      <a
                        href="${escapeHTML(post.video_url)}"
                        target="_blank"
                        rel="noopener noreferrer"
                      >
                        ▶ Tazama Video
                      </a>
                    </p>
                  `
                  : ""
              }

              <div class="news-date">
                ${formatDate(post.created_at)}
              </div>

            </div>

          </article>
        `;

      }).join("");
    }

    loadNews();
  </script>

</body>
</html>
