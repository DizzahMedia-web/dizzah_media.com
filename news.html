<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>News | Dizzah Media</title>

  <meta name="description" content="Habari za Tanzania na Dunia kupitia Dizzah Media. Hakika leo, kesho kwa ubora zaidi.">
  <meta name="theme-color" content="#070707">

  <link rel="icon" href="assets/favicon-32.png">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #070707;
      color: #fff;
      line-height: 1.6;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    img {
      display: block;
      width: 100%;
    }

    .container {
      width: min(1180px, 92%);
      margin: auto;
    }

    /* HEADER */

    header {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: rgba(5, 5, 5, 0.96);
      border-bottom: 1px solid rgba(255,255,255,0.08);
      backdrop-filter: blur(12px);
    }

    .nav {
      min-height: 76px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 25px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 800;
      letter-spacing: 1px;
      white-space: nowrap;
    }

    .brand img {
      width: 48px;
      height: 48px;
      object-fit: contain;
    }

    .brand span {
      font-size: 20px;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    .nav-links a {
      color: #ddd;
      font-size: 14px;
      font-weight: 600;
      transition: .3s;
    }

    .nav-links a:hover {
      color: #fff;
    }

    .nav-button {
      background: #e50914;
      color: #fff !important;
      padding: 10px 16px;
      border-radius: 8px;
    }

    .nav-button:hover {
      background: #ff1b26 !important;
    }

    /* PAGE HERO */

    .page-hero {
      padding: 110px 0 80px;
      background:
        radial-gradient(circle at 80% 30%, rgba(229,9,20,.22), transparent 35%),
        #070707;
      border-bottom: 1px solid rgba(255,255,255,.07);
    }

    .label {
      display: inline-block;
      padding: 7px 13px;
      border: 1px solid rgba(255,255,255,.15);
      border-radius: 30px;
      color: #ccc;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1px;
      margin-bottom: 20px;
    }

    .page-hero h1 {
      font-size: clamp(42px, 7vw, 76px);
      line-height: 1;
      margin-bottom: 20px;
      letter-spacing: -2px;
    }

    .page-hero h1 span {
      color: #e50914;
    }

    .page-hero p {
      max-width: 700px;
      color: #aaa;
      font-size: 17px;
    }

    /* NEWS SECTION */

    .news-section {
      padding: 80px 0;
    }

    .section-heading {
      margin-bottom: 35px;
    }

    .section-heading h2 {
      font-size: clamp(28px, 4vw, 42px);
      margin-bottom: 8px;
    }

    .section-heading p {
      color: #888;
      font-size: 14px;
    }

    .news-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 25px;
    }

    .news-card {
      background: #111;
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 15px;
      overflow: hidden;
      transition: .35s;
    }

    .news-card:hover {
      transform: translateY(-6px);
      border-color: rgba(229,9,20,.55);
      box-shadow: 0 18px 45px rgba(0,0,0,.35);
    }

    .news-image {
      height: 300px;
      background: #181818;
      overflow: hidden;
    }

    .news-image img {
      height: 100%;
      object-fit: cover;
      transition: .4s;
    }

    .news-card:hover .news-image img {
      transform: scale(1.05);
    }

    .news-content {
      padding: 25px;
    }

    .category {
      color: #e50914;
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 1px;
      margin-bottom: 10px;
    }

    .news-content h3 {
      font-size: 25px;
      margin-bottom: 10px;
    }

    .news-content p {
      color: #999;
      font-size: 14px;
      margin-bottom: 20px;
    }

      display: inline-block;
      color: #fff;
      font-size: 13px
