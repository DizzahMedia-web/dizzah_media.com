<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Habari | Dizzah Media</title>

  <meta
    name="description"
    content="Soma habari mpya kutoka Dizzah Media."
  >

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f6f8;
      color: #222;
      line-height: 1.6;
    }

    /* HEADER */
    header {
      background: #111;
      color: white;
      padding: 16px 20px;
      position: sticky;
      top: 0;
      z-index: 1000;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }

    .header-inner {
      max-width: 1100px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }

    .logo {
      font-size: 22px;
      font-weight: bold;
      color: white;
      text-decoration: none;
    }

    .back-btn {
      color: white;
      text-decoration: none;
      border: 1px solid #555;
      padding: 7px 12px;
      border-radius: 6px;
      font-size: 14px;
    }

    .back-btn:hover {
      background: #222;
    }

    /* HERO */
    .hero {
      background: white;
      padding: 45px 20px 35px;
      text-align: center;
      border-bottom: 1px solid #e5e5e5;
    }

    .hero h1 {
      font-size: 34px;
      margin-bottom: 8px;
      color: #111;
    }

    .hero p {
      color: #666;
      font-size: 16px;
    }

    /* MAIN */
    main {
      max-width: 1100px;
      margin: 35px auto;
      padding: 0 20px;
    }

    .section-title {
      font-size: 24px;
      margin-bottom: 22px;
      color: #111;
    }

    /* LOADING */
    .loading {
      background: white;
      padding: 30px;
      text-align: center;
      border-radius: 10px;
      color: #666;
    }

    /* EMPTY */
    .empty {
      background: white;
      padding: 45px 20px;
      text-align: center;
      border-radius: 12px;
      color: #666;
      border: 1px solid #e5e5e5;
    }

    .empty h2 {
      color: #333;
      margin-bottom: 8px;
    }

    /* ERROR */
    .error {
      background: #fff0f0;
      color: #b00020;
      padding: 20px;
      border-radius: 10px;
      border: 1px solid #ffcaca;
    }

    /* NEWS GRID */
    .news-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 22px;
    }

    /* NEWS CARD */
    .news-card {
      background: white;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #e5e5e5;
      box-shadow: 0 3px 12px rgba(0,0,0,0.06);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .news-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 7px 20px rgba(0,0,0,0.10);
    }

    .news-image {
      width: 100%;
      height: 210px;
      object-fit: cover;
      display: block;
      background: #eee;
    }

    .no-image {
      height: 210px;
      background: #eeeeee;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #888;
      font-size: 15px;
      text-align: center;
      padding: 20px;
    }

    .news-content {
      padding: 18px;
    }

    .category {
      display: inline-block;
      background: #111;
      color: white;
      font-size: 12px;
      padding: 5px 9px;
      border-radius: 5px;
      margin-bottom: 10px;
    }

    .news-title {
      font-size: 20px;
      line-height: 1.35;
      margin-bottom: 9px;
      color: #111;
    }

    .date {
      color: #888;
      font-size: 13px;
      margin-bottom: 12px;
    }

    .description {
      color: #555;
      font-size: 15px;
      margin-bottom: 15px;
    }

    .video-link {
      display: inline-block;
      background: #e60000;
      color: white;
      text-decoration: none;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 14px;
    }

    .video-link:hover {
      background: #c00000;
    }

    /* FOOTER */
    footer {
      background: #111;
      color: #bbb;
      text-align: center;
      padding: 25px 15px;
      margin-top: 50px;
      font-size: 14px;
    }

    /* MOBILE */
    @media (max-width: 850px) {
      .news-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 600px) {
      .header-inner {
        flex-direction: row;
      }

      .logo {
        font-size: 19px;
      }

      .hero {
        padding: 35px 15px 28px;
      }

      .hero h1 {
        font-size: 27px;
      }

      main {
        margin: 25px auto;
        padding: 0 14px;
      }

      .section-title {
        font-size: 21px;
      }

      .news-grid {
        grid-template-columns: 1fr;
      }

      .news-image,
      .no-image {
        height: 220px;
      }
    }
  </style>
</head>

<body>

  <!-- HEADER -->
  <header>
    <div class="header-inner">

      <a href="index.html" class="logo">
        DIZZAH MEDIA
      </a>

      <a href="index.html" class="back-btn">
        ← Home
      </a>

    </div>
  </header>


  <!-- HERO -->
  <section class="hero">
    <h1>Habari za Dizzah Media</h1>
    <p>Habari mpya kutoka Dizzah Media</p>
  </section>


  <!-- MAIN CONTENT -->
  <main>

    <h2 class="section-title">
      Habari Mpya
    </h2>

    <div id="newsContainer">

      <div class="loading">
        Inapakia habari...
      </div>

    </div>

  </main>


  <!-- FOOTER -->
  <footer>
    © 2026 Dizzah Media. Haki zote zimehifadhiwa.
  </footer>


  <!-- SUPABASE + NEWS SYSTEM -->
  <script>

    /* ==============================
       SUPABASE CONNECTION
    ============================== */

    const SUPABASE_URL =
      "https://otmejtcequreccarwvkt.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_9vUQ1lhAWELSbSGrk7Aw_Q_0h0-WvuX";

    const { createClient } = window.supabase;

    const supabaseClient = createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );


    /* ==============================
       NEWS CONTAINER
    ============================== */

    const newsContainer =
      document.getElementById("newsContainer");


    /* ==============================
       ESCAPE HTML
       Inazuia maandishi ya database
       kuharibu ukurasa
    ============================== */

    function escapeHTML(value) {

      if (value === null || value === undefined) {
        return "";
      }

      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }


    /* ==============================
       DATE FORMAT
    ============================== */

    function formatDate(dateValue) {

      if (!dateValue) {
        return "";
      }

      const date = new Date(dateValue);

      if (isNaN(date.getTime())) {
        return "";
      }

      return date.toLocaleDateString(
        "sw-TZ",
        {
          day: "numeric",
          month: "long",
          year: "numeric"
        }
      );
    }


    /* ==============================
       LOAD NEWS
    ============================== */

    async function loadNews() {

      newsContainer.innerHTML = `
        <div class="loading">
          Inapakia habari...
        </div>
      `;


      const { data, error } = await supabaseClient

        .from("posts")

        .select(
          "id,title,category,image_url,video_url,description,created_at"
        )

        .eq("category", "Habari")

        .order(
          "created_at",
          {
            ascending: false
          }
        );


      /* ==============================
         ERROR
      ============================== */

      if (error) {

        console.error(
          "Supabase error:",
          error
        );

        newsContainer.innerHTML = `
          <div class="error">
            <strong>Imeshindikana kupakia habari.</strong>
            <br>
            Tafadhali jaribu tena baadaye.
          </div>
        `;

        return;
      }


      /* ==============================
         NO NEWS
      ============================== */

      if (!data || data.length === 0) {

        newsContainer.innerHTML = `
          <div class="empty">

            <h2>
              Hakuna habari zilizochapishwa bado
            </h2>

            <p>
              Habari mpya zitaonekana hapa baada ya
              kuchapishwa kupitia Dizzah Media Admin.
            </p>

          </div>
        `;

        return;
      }


      /* ==============================
         NEWS GRID
      ============================== */

      const grid =
        document.createElement("div");

      grid.className = "news-grid";


      /* ==============================
         CREATE EACH NEWS CARD
      ============================== */

      data.forEach(post => {

        const card =
          document.createElement("article");

        card.className = "news-card";


        /* IMAGE */

        let imageHTML = "";

        if (
          post.image_url &&
          post.image_url.trim() !== ""
        ) {

          imageHTML = `
            <img
              src="${escapeHTML(post.image_url)}"
              alt="${escapeHTML(post.title)}"
              class="news-image"
              loading="lazy"
              onerror="
                this.style.display='none';
                this.nextElementSibling.style.display='flex';
              "
            >

            <div
              class="no-image"
              style="display:none;"
            >
              Picha haikupatikana
            </div>
          `;

        } else {

          imageHTML = `
            <div class="no-image">
              Hakuna picha ya habari hii
            </div>
          `;
        }


        /* VIDEO */

        let videoHTML = "";

        if (
          post.video_url &&
          post.video_url.trim() !== ""
        ) {

          videoHTML = `
            <a
              href="${escapeHTML(post.video_url)}"
              target="_blank"
              rel="noopener noreferrer"
              class="video-link"
            >
              ▶ Tazama Video
            </a>
          `;
        }


        /* CARD */

        card.innerHTML = `

          ${imageHTML}

          <div class="news-content">

            <span class="category">
              ${escapeHTML(post.category || "Habari")}
            </span>

            <h3 class="news-title">
              ${escapeHTML(post.title || "Bila kichwa")}
            </h3>

            <div class="date">
              ${formatDate(post.created_at)}
            </div>

            <p class="description">
              ${escapeHTML(
                post.description ||
                "Hakuna maelezo ya habari hii."
              )}
            </p>

            ${videoHTML}

          </div>

        `;


        grid.appendChild(card);

      });


      /* ==============================
         DISPLAY NEWS
      ============================== */

      newsContainer.innerHTML = "";

      newsContainer.appendChild(grid);

    }


    /* ==============================
       START
    ============================== */

    loadNews();

  </script>

</body>
</html>
