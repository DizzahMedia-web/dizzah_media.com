<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Admin Login | Dizzah Media</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #111, #2b2b2b);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 420px;
      background: #fff;
      border-radius: 15px;
      padding: 35px 25px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.35);
    }

    .logo {
      text-align: center;
      font-size: 28px;
      font-weight: bold;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }

    .logo span {
      color: #e50914;
    }

    .subtitle {
      text-align: center;
      color: #777;
      font-size: 14px;
      margin-bottom: 30px;
    }

    .icon {
      width: 70px;
      height: 70px;
      margin: 0 auto 18px;
      background: #111;
      color: #fff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
    }

    .field {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-size: 14px;
      font-weight: bold;
      color: #333;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 8px;
      outline: none;
      font-size: 15px;
    }

    input:focus {
      border-color: #e50914;
    }

    .password-box {
      position: relative;
    }

    .password-box input {
      padding-right: 50px;
    }

    .show-password {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      border: none;
      background: none;
      cursor: pointer;
      font-size: 18px;
    }

    .login-btn {
      width: 100%;
      border: none;
      padding: 14px;
      background: #e50914;
      color: white;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 5px;
    }

    .login-btn:hover {
      opacity: 0.9;
    }

    .message {
      display: none;
      margin-top: 15px;
      padding: 12px;
      border-radius: 7px;
      text-align: center;
      font-size: 14px;
      font-weight: bold;
    }

    .error {
      background: #ffe5e5;
      color: #c40000;
    }

    .success {
      background: #e6f7ed;
      color: #137a3a;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 22px;
      color: #555;
      text-decoration: none;
      font-size: 14px;
    }

    .back:hover {
      color: #e50914;
    }

    .security {
      text-align: center;
      margin-top: 20px;
      font-size: 12px;
      color: #999;
      line-height: 1.5;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <div class="icon">🔐</div>

    <div class="logo">
      DIZZAH <span>MEDIA</span>
    </div>

    <p class="subtitle">
      Ingia kwenye Admin Dashboard
    </p>

    <form id="loginForm">

      <div class="field">

        <label for="username">
          Username
        </label>

        <input
          type="text"
          id="username"
          placeholder="Ingiza username"
          autocomplete="username"
          required
        >

      </div>


      <div class="field">

        <label for="password">
          Password
        </label>

        <div class="password-box">

          <input
            type="password"
            id="password"
            placeholder="Ingiza password"
            autocomplete="current-password"
            required
          >

          <button
            type="button"
            class="show-password"
            onclick="togglePassword()"
          >
            👁️
          </button>

        </div>

      </div>


      <button
        type="submit"
        class="login-btn"
      >
        🔐 INGIA
      </button>

    </form>


    <div
      id="message"
      class="message"
    ></div>


    <a
      href="index.html"
      class="back"
    >
      ← Rudi kwenye Dizzah Media
    </a>


    <div class="security">
      🔒 Eneo hili ni kwa ajili ya usimamizi wa Dizzah Media.
    </div>

  </div>


  <script>

    const loginForm =
      document.getElementById("loginForm");

    const message =
      document.getElementById("message");


    function togglePassword() {

      const password =
        document.getElementById("password");

      if (password.type === "password") {

        password.type = "text";

      } else {

        password.type = "password";

      }

    }


    loginForm.addEventListener("submit", function(event) {

      event.preventDefault();

      /*
       * HAPA HATUTAWEKA PASSWORD HALISI.
       *
       * Mfumo wa login salama tutauunganisha
       * na authentication/database katika hatua
       * inayofuata.
       */

      message.className = "message success";

      message.textContent =
        "Login interface iko tayari. Authentication salama itaunganishwa katika hatua inayofuata.";

      message.style.display = "block";

    });

  </script>

</body>
</html>
