<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dizzah Media - Admin Login</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #111827, #1f2937);
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 420px;
      background: white;
      padding: 35px 28px;
      border-radius: 18px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.25);
    }

    .logo {
      text-align: center;
      margin-bottom: 25px;
    }

    .logo h1 {
      font-size: 30px;
      color: #111827;
      font-weight: 800;
    }

    .logo p {
      margin-top: 7px;
      color: #6b7280;
      font-size: 14px;
    }

    h2 {
      text-align: center;
      margin-bottom: 25px;
      color: #111827;
    }

    label {
      display: block;
      margin-bottom: 7px;
      color: #374151;
      font-weight: 600;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      margin-bottom: 18px;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #2563eb;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    .message {
      display: none;
      margin-top: 18px;
      padding: 12px;
      border-radius: 9px;
      font-size: 14px;
      text-align: center;
    }

    .error {
      display: block;
      background: #fee2e2;
      color: #b91c1c;
    }

    .success {
      display: block;
      background: #dcfce7;
      color: #166534;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 22px;
      color: #2563eb;
      text-decoration: none;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <div class="logo">
      <h1>DIZZAH MEDIA</h1>
      <p>Admin Dashboard</p>
    </div>

    <h2>Admin Login</h2>

    <form id="loginForm">

      <label for="email">Email</label>
      <input
        type="email"
        id="email"
        placeholder="Ingiza email yako"
        required
      >

      <label for="password">Password</label>
      <input
        type="password"
        id="password"
        placeholder="Ingiza password yako"
        required
      >

      <button type="submit" id="loginButton">
        Ingia kwenye Admin
      </button>

    </form>

    <div id="message" class="message"></div>

    <a href="index.html" class="back">
      ← Rudi kwenye Dizzah Media
    </a>

  </div>

  <script>

    /* ================================
       SUPABASE CONFIGURATION
       ================================ */

    const SUPABASE_URL =
      "https://otmejtcequreccarwvkt.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_9vUQ1lhAWELSbSGrk7Aw_Q_0h0-WvuX";
    


    /* ================================
       SUPABASE CONNECTION
       ================================ */

    const { createClient } = window.supabase;

    const supabaseClient = createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );


    /* ================================
       LOGIN FORM
       ================================ */

    const loginForm = document.getElementById("loginForm");
    const loginButton = document.getElementById("loginButton");
    const message = document.getElementById("message");


    loginForm.addEventListener("submit", async function(event) {

      event.preventDefault();

      const email =
        document.getElementById("email").value.trim();

      const password =
        document.getElementById("password").value;


      message.className = "message";
      message.textContent = "";

      loginButton.disabled = true;
      loginButton.textContent = "Inaingia...";


      try {

        const { data, error } =
          await supabaseClient.auth.signInWithPassword({
            email: email,
            password: password
          });


        if (error) {
          throw error;
        }


        if (data.session) {

          message.className = "message success";
          message.textContent =
            "Umefanikiwa kuingia. Inafungua Admin Dashboard...";


          setTimeout(function() {
            window.location.href = "admin.html";
          }, 800);

        } else {

          throw new Error(
            "Login imekamilika lakini session haijapatikana."
          );

        }

      } catch (error) {

        message.className = "message error";

        if (
          error.message &&
          error.message.toLowerCase().includes("invalid login")
        ) {

          message.textContent =
            "Email au password si sahihi.";

        } else {

          message.textContent =
            "Imeshindikana kuingia: " +
            (error.message || "Tatizo lisilojulikana.");

        }

        loginButton.disabled = false;
        loginButton.textContent = "Ingia kwenye Admin";
      }

    });


    /* ================================
       CHECK EXISTING SESSION
       ================================ */

    async function checkSession() {

      const { data } =
        await supabaseClient.auth.getSession();

      if (data.session) {
        window.location.href = "admin.html";
      }

    }

    checkSession();

  </script>

</body>
</html>
