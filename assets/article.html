  <script>
    const root=document.getElementById('articleRoot');
    const escapeHTML=(v)=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
    const date=(v)=>v?new Date(v).toLocaleDateString('sw-TZ',{day:'numeric',month:'long',year:'numeric'}):'';
    (async()=>{const id=new URLSearchParams(location.search).get('id');const posts=await DizzahContent.getPosts();const post=posts.find(p=>String(p.id)===String(id))||posts[0];if(!post){root.innerHTML='<div class="status-box"><h2>Article haijapatikana</h2><p>Rudi kwenye ukurasa wa habari uone articles zilizopo.</p></div>';return;}document.title=`${post.title} | Dizzah Media`;const body=post.body||post.description||'Dizzah Media inaendelea kuleta maudhui yenye ubora kwa hadhira ya Tanzania, Afrika na dunia.';const related=posts.filter(p=>p.id!==post.id).slice(0,3);root.innerHTML=`<div class="article-layout"><article class="article-main"><img class="article-cover" src="${escapeHTML(post.image_url||'assets/news1.jpg')}" alt="${escapeHTML(post.title)}" onerror="this.src='assets/news1.jpg'"><div class="article-content"><div class="article-kicker">${escapeHTML(post.category||'News')}</div><h1>${escapeHTML(post.title)}</h1><p class="article-deck">${escapeHTML(post.description||'')}</p><div class="article-meta"><span>${escapeHTML(post.author||'Dizzah Media Editorial')}</span><span>${date(post.created_at)}</span></div><div class="article-body"><p>${escapeHTML(body)}</p></div><div class="share-row"><a target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(post.title+' — '+location.href)}">Shiriki WhatsApp</a><a target="_blank" rel="noopener" href="https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(location.href)}">Shiriki Facebook</a><a href="mailto:?subject=${encodeURIComponent(post.title)}&body=${encodeURIComponent(location.href)}">Tuma Email</a></div><a class="back-link" href="news.html">← Rudi kwenye habari</a></div></article><aside class="article-side"><div class="side-card"><h2>Related Stories</h2>${related.map(p=>`<a class="related-link" href="article.html?id=${encodeURIComponent(p.id)}">${escapeHTML(p.title)}</a>`).join('')}</div><div class="side-card"><h2>Ujumbe kwa newsroom</h2><p class="text-muted">Una taarifa au story? Tuma kwa timu ya Dizzah Media.</p><a class="back-link" href="contact.html">Wasiliana nasi →</a></div></aside></div>`;})();
  </script>
