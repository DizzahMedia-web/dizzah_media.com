<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Simulizi | Dizzah Media</title>

  <meta name="description" content="Simulizi za maisha, hadithi za kweli, hamasa na stories kutoka Dizzah Media.">
  <meta name="theme-color" content="#070707">

  <link rel="icon" href="assets/favicon-32.png">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #070707;
      color: #fff;
      line-height: 1.6;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    img {
      display: block;
      width: 100%;
    }

    .container {
      width: min(1180px, 92%);
      margin: auto;
    }

    /* HEADER */

    header {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: rgba(5, 5, 5, 0.96);
      border-bottom: 1px solid rgba(255,255,255,0.08);
      backdrop-filter: blur(12px);
    }

    .nav {
      min-height: 76px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 25px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 800;
      letter-spacing: 1px;
      white-space: nowrap;
    }

    .brand img {
      width: 48px;
      height: 48px;
      object-fit: contain;
    }

    .brand span {
      font-size: 20px;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    .nav-links a {
      color: #ddd;
      font-size: 14px;
      font-weight: 600;
      transition: .3s;
    }

    .nav-links a:hover {
      color: #fff;
    }

    .nav-button {
      background: #e50914;
      color: #fff !important;
      padding: 10px 16px;
      border-radius: 8px;
    }

    .nav-button:hover {
      background: #ff1b26 !important;
    }

    /* HERO */

    .page-hero {
      padding: 110px 0 80px;
      background:
        radial-gradient(circle at 80% 30%, rgba(229,9,20,.22), transparent 35%),
        #070707;
      border-bottom: 1px solid rgba(255,255,255,.07);
    }
